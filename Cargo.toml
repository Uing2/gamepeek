[package]
name = "gamepeek"
version = "0.1.0"
edition = "2021"
description = "在游戏与视频窗口之间一键切换，并自动静音/暂停"
license = "MIT"

[[bin]]
name = "gamepeek"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Time",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"